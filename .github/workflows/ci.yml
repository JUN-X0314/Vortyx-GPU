name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run vortyx (informational hardware discovery output)
        shell: bash
        run: |
          if [ -f build/Release/vortyx.exe ]; then
            ./build/Release/vortyx.exe
          elif [ -f build/vortyx ]; then
            ./build/vortyx
          elif [ -f build/vortyx.exe ]; then
            ./build/vortyx.exe
          else
            echo "vortyx executable not found"
            exit 1
          fi
