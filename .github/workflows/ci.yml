name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Linux: the Vulkan loader (libvulkan-dev) plus Mesa's lavapipe
      # software Vulkan implementation (mesa-vulkan-drivers) let the GPU
      # compute tests run for real on the CI runner (software device).
      - name: Install Vulkan loader + software device (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers

      # Windows: try to install the Vulkan SDK so the GPU backend compiles.
      # Runner machines have no Vulkan ICD, so GPU tests will report
      # "unavailable" there and the CPU path is verified instead.
      - name: Install Vulkan SDK (Windows, best effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install vulkan-sdk -y --no-progress

      - name: Configure (CMake)
        shell: bash
        run: |
          # On Windows the chocolatey SDK install may not export VULKAN_SDK
          # into this session; detect the SDK directory and export it so
          # find_package(Vulkan) succeeds and the GPU backend compiles.
          if [ "$RUNNER_OS" == "Windows" ]; then
            SDK_DIR=$(ls -d /c/VulkanSDK/*/ 2>/dev/null | head -1 || true)
            if [ -n "$SDK_DIR" ]; then
              export VULKAN_SDK="$(cygpath -w "${SDK_DIR%/}")"
              echo "VULKAN_SDK=$VULKAN_SDK"
            fi
          fi
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run vortyx (informational discovery + compute output)
        shell: bash
        run: |
          if [ -f build/Release/vortyx.exe ]; then
            ./build/Release/vortyx.exe
          elif [ -f build/vortyx ]; then
            ./build/vortyx
          elif [ -f build/vortyx.exe ]; then
            ./build/vortyx.exe
          else
            echo "vortyx executable not found"
            exit 1
          fi

  # Phase 11: the platform (control-plane) API layer (platform/api) is pure
  # TypeScript tested with node:test — no npm install, no Supabase, no
  # secrets, no network (the tests run against the local/mock store). A
  # separate additive job keeps the C++ jobs above untouched. The layer is
  # ALSO covered by the C++ jobs: vortyx_platform builds with the core in
  # every matrix job, and the CPU-only job proves VORTYX_ENABLE_PLATFORM=OFF
  # still produces the Phase 10 build.
  platform-api:
    name: Platform API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test platform/api (node --test, local/mock store)
        working-directory: platform/api
        run: node --test --experimental-strip-types

  # Phase 15: the web console is a no-build static SPA; its LOGIC modules
  # (session lifecycle, API client, error mapping) are tested with node:test
  # against DOM/fetch/localStorage stubs. No npm install, no secrets, no
  # network — the same local/mock discipline as the platform-api job.
  web-console:
    name: Web console tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test platform/web logic modules (node --test)
        working-directory: platform/web
        run: node --test

  # Phase 9: the CPU-only build is a core project guarantee ("building and
  # running Vortyx never requires the Vulkan SDK"), so CI verifies it
  # explicitly: no Vulkan SDK/loader, VORTYX_ENABLE_VULKAN=OFF, full test
  # suite (GPU tests exit with their honest SKIP note). The GPU-enabled job
  # above is unchanged and still exercises the real Vulkan backend path.
  build-cpu-only:
    name: Build & Test CPU-only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (CMake, Vulkan disabled)
        shell: bash
        run: cmake -B build-cpu-only -S . -DCMAKE_BUILD_TYPE=Release -DVORTYX_ENABLE_VULKAN=OFF

      - name: Build
        run: cmake --build build-cpu-only --config Release

      - name: Test
        run: ctest --test-dir build-cpu-only -C Release --output-on-failure

  # Phase 12: the platform=OFF guarantee is re-verified additively — with
  # VORTYX_ENABLE_PLATFORM=OFF the distributed layer disables itself with
  # the platform layer and the project must build and test exactly like
  # Phase 10 (19 tests, no platform/distributed targets). A separate
  # additive job keeps every existing job untouched.
  build-no-platform:
    name: Build & Test Platform=OFF (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (CMake, platform disabled)
        shell: bash
        run: cmake -B build-no-platform -S . -DCMAKE_BUILD_TYPE=Release -DVORTYX_ENABLE_PLATFORM=OFF

      - name: Build
        run: cmake --build build-no-platform --config Release

      - name: Test
        run: ctest --test-dir build-no-platform -C Release --output-on-failure

  # Phase 12: a Clang build on Linux (the spec asks for Clang coverage when
  # available; additive — the existing matrix jobs are unchanged).
  build-clang:
    name: Build & Test (Clang, Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vulkan loader + software device (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers clang

      - name: Configure (CMake, Clang)
        shell: bash
        run: CC=clang CXX=clang++ cmake -B build-clang -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-clang --config Release -j2

      - name: Test
        run: ctest --test-dir build-clang -C Release --output-on-failure

  # Phase 13: the tensor layer is additive ON TOP of the distributed layer;
  # with VORTYX_ENABLE_TENSOR=OFF the project must build and test exactly
  # like Phase 12. A separate additive job keeps every existing job
  # untouched (the matrix jobs above build with the tensor layer ON by
  # default, so the tensor tests run on Windows/Ubuntu/Clang already).
  build-no-tensor:
    name: Build & Test Tensor=OFF (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (CMake, tensor disabled)
        shell: bash
        run: cmake -B build-no-tensor -S . -DCMAKE_BUILD_TYPE=Release -DVORTYX_ENABLE_TENSOR=OFF

      - name: Build
        run: cmake --build build-no-tensor --config Release

      - name: Test
        run: ctest --test-dir build-no-tensor -C Release --output-on-failure

  # Phase 14: the service layer is additive ON TOP of the tensor layer;
  # with VORTYX_ENABLE_SERVICE=OFF the project must build and test exactly
  # like Phase 13. A separate additive job keeps every existing job
  # untouched (the matrix jobs above build with the service layer ON by
  # default, so the service tests run on Windows/Ubuntu/Clang already).
  build-no-service:
    name: Build & Test Service=OFF (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (CMake, service disabled)
        shell: bash
        run: cmake -B build-no-service -S . -DCMAKE_BUILD_TYPE=Release -DVORTYX_ENABLE_SERVICE=OFF

      - name: Build
        run: cmake --build build-no-service --config Release

      - name: Test
        run: ctest --test-dir build-no-service -C Release --output-on-failure

  # Phase 16: the Adaptive Compute Fabric is additive ON TOP of the
  # distributed layer; with VORTYX_ENABLE_FABRIC=OFF the fabric disables
  # itself — and the tensor layer (its Phase 16 adapter builds on the
  # fabric) with it — reproducing the Phase 15 build exactly. A separate
  # additive job keeps every existing job untouched (the matrix jobs above
  # build with the fabric ON by default, so the fabric tests run on
  # Windows/Ubuntu/Clang already).
  build-no-fabric:
    name: Build & Test Fabric=OFF (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (CMake, fabric disabled)
        shell: bash
        run: cmake -B build-no-fabric -S . -DCMAKE_BUILD_TYPE=Release -DVORTYX_ENABLE_FABRIC=OFF

      - name: Build
        run: cmake --build build-no-fabric --config Release

      - name: Test
        run: ctest --test-dir build-no-fabric -C Release --output-on-failure

  # Phase 15.0.1 verification hardening: the database-level guarantees
  # (project-row quota serialization, artifact-capacity serialization, the
  # rate-limit RPC, terminal-state immutability, the claim race) are
  # enforced by migration 0004 in REAL PostgreSQL — so CI runs them against
  # a REAL PostgreSQL 17, the documented target version. The committed
  # script applies 0001 -> 0004 verbatim in lexicographic order (the
  # dependency chain proven by applying it), then races submissions /
  # artifact inserts / rate-limit takes / worker claims from concurrent
  # connections and pins the exact outcomes. The PGPASSWORD below is the
  # EPHEMERAL service-container credential: it exists only inside this job
  # and is never a repository secret or a real environment credential.
  postgres-integration:
    name: PostgreSQL 17 integration (migrations + concurrency)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run integration suite (stubs + 0001..0004 + concurrency races)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: vortyx
        run: python3 scripts/pg_integration_test.py

  # Phase 15.0.1 verification hardening: the whole C++ test suite under
  # AddressSanitizer + UndefinedBehaviorSanitizer (Debug, GCC/Clang-only
  # option VORTYX_ENABLE_SANITIZERS — with MSVC the configure refuses
  # honestly). UBSan is built with -fno-sanitize-recover=all and ASan aborts
  # by default, so a sanitizer finding fails CTest and fails this job —
  # sanitizer runs execute the tests, they never stop at compile-only.
  # Vulkan is OFF here to keep the sanitizer run hermetic (no software GPU
  # stack under ASan); the Vulkan-enabled functional path is covered by the
  # matrix jobs above. This job also gives the Debug configuration its CI
  # build+test coverage.
  build-sanitizers:
    name: Build & Test Sanitizers (ASan+UBSan, Debug, Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ubuntu 24.04 runners ship vm.mmap_rnd_bits=32, which breaks the
      # AddressSanitizer shadow mapping; 28 is the documented workaround.
      - name: Fix ASan kernel knob
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure (CMake, sanitizers ON, Vulkan OFF)
        shell: bash
        run: cmake -B build-sanitize -S . -DCMAKE_BUILD_TYPE=Debug -DVORTYX_ENABLE_SANITIZERS=ON -DVORTYX_ENABLE_VULKAN=OFF

      - name: Build
        run: cmake --build build-sanitize -j2

      - name: Test
        run: ctest --test-dir build-sanitize -C Debug --output-on-failure
